{% extends "main/layout.html" %}

{% block title %}Вхід{% endblock %}

{% block content %}
<div class="card shadow-sm">
    <div class="card-body">
        <h1 class="h3 mb-4">Вхід на сайт</h1>
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button class="btn btn-primary" type="submit">Увійти</button>
        </form>
        {% if message %}
        <p class="alert alert-info mt-4 mb-0">{{ message }}</p>
        {% endif %}
    </div>
</div>
{% endblock %}
