{% extends "main/layout.html" %}

{% block title %}Робота з числами{% endblock %}

{% block content %}
<div class="card shadow-sm">
    <div class="card-body">
        <h1 class="h3 mb-4">Мінімум, максимум або середнє</h1>
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button class="btn btn-primary" type="submit">Обчислити</button>
        </form>
        {% if result is not None %}
        <p class="alert alert-success mt-4 mb-0">Результат: <strong>{{ result }}</strong></p>
        {% endif %}
    </div>
</div>
{% endblock %}
