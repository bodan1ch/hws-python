{% extends "main/layout.html" %}

{% block title %}{{ title }} — Вінниця{% endblock %}

{% block content %}
<main class="container py-5">
    <section class="card border-0 shadow-sm">
        <div class="card-body p-4 p-md-5">
            <h1 class="mb-3">{{ heading }}</h1>
            <p class="lead">{{ intro }}</p>
            <ul class="mb-4">
                {% for item in items %}
                <li>{{ item }}</li>
                {% endfor %}
            </ul>

            {% if title == "Історія" %}
            <div class="d-flex flex-wrap gap-2">
                <a class="btn btn-outline-primary" href="{% url 'history_people' %}">Відомі мешканці</a>
                <a class="btn btn-outline-primary" href="{% url 'history_photos' %}">Історичні фотографії</a>
            </div>
            {% endif %}

            <a class="btn btn-primary mt-4" href="{% url 'index' %}">На головну</a>
        </div>
    </section>
</main>
{% endblock %}
