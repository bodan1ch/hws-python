<!doctype html>
<html lang="uk">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Каталог товарів</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <main class="container py-5">
        <h1 class="mb-4">Каталог товарів</h1>
        <div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4">
            {% for product in products %}
            <div class="col">
                <a class="card h-100 text-decoration-none text-dark shadow-sm" href="{{ url_for('product_detail', product_id=product.id) }}">
                    <img src="{{ product.image }}" class="card-img-top" alt="{{ product.title }}" style="height: 240px; object-fit: cover;">
                    <div class="card-body">
                        <h2 class="card-title h5">{{ product.title }}</h2>
                        <p class="card-text mb-1">Рейтинг: {{ product.rating }} / 5</p>
                        <p class="card-text fw-bold">{{ "%.2f"|format(product.price) }} грн</p>
                    </div>
                </a>
            </div>
            {% endfor %}
        </div>
    </main>
</body>
</html>
