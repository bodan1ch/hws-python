<!doctype html>
<html lang="uk">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ product.title }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <main class="container py-5">
        <a href="{{ url_for('index') }}" class="btn btn-outline-secondary mb-4">До каталогу</a>
        <article class="card mx-auto shadow-sm" style="max-width: 720px;">
            <img src="{{ product.image }}" class="card-img-top" alt="{{ product.title }}" style="max-height: 420px; object-fit: cover;">
            <div class="card-body">
                <h1 class="card-title">{{ product.title }}</h1>
                <p class="card-text">Рейтинг: {{ product.rating }} / 5</p>
                <p class="card-text fs-4 fw-bold">{{ "%.2f"|format(product.price) }} грн</p>
            </div>
        </article>
    </main>
</body>
</html>
